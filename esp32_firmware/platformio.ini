; ============================================================
;  PlatformIO Configuration - ESP32 QR Access Control
;  
;  Para compilar y subir:
;    1. Instalar PlatformIO (VS Code extension o CLI)
;    2. Conectar ESP32 por USB
;    3. Ejecutar: pio run --target upload
;    4. Monitor serial: pio device monitor
; ============================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Librerías necesarias
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

; Configuración de compilación
build_flags = 
    -D CORE_DEBUG_LEVEL=3

; Puerto serial del monitor (ajustar si es diferente)
; monitor_port = COM3
